name: Build MAUI Samples (.NET 9)

on:
  push:
    branches: [ development, main, master ]
  pull_request:
    branches: [ development, main, master ]

jobs:
  build-windows:
    name: Build (Windows, .NET 9)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads (Windows)
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore Samples.sln

      - name: Build
        run: dotnet build Samples.sln -c Release --no-restore

  build-macos:
    name: Build (macOS, .NET 9)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads (macOS)
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore Samples.sln

      - name: Build
        run: dotnet build Samples.sln -c Release --no-restore

  build-ubuntu:
    name: Build (Linux, .NET 9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Samples.sln

      - name: Build
        run: dotnet build Samples.sln -c Release --no-restore

# Note: Building full MAUI apps in CI may require platform-specific SDKs and certificates.
# This workflow ensures CI uses .NET 9 and attempts a restore/build on major platforms.
